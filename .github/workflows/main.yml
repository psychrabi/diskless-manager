name: "Publish Release"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  APP_NAME: "Diskless Boot Server"

jobs:
  changelog:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    outputs:
      changelog: ${{ steps.build_changelog.outputs.changelog }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build changelog
        id: build_changelog
        run: |
          ALL_TAGS=$(git tag --sort=-v:refname)
          CURRENT_TAG=${GITHUB_REF#refs/tags/}

          PREVIOUS_TAG=""
          FOUND_CURRENT=false
          for tag in $ALL_TAGS; do
            if [ "$tag" = "$CURRENT_TAG" ]; then
              FOUND_CURRENT=true
              continue
            fi
            if [ "$FOUND_CURRENT" = true ]; then
              PREVIOUS_TAG=$tag
              break
            fi
          done

          if [ -z "$PREVIOUS_TAG" ]; then
            changelog=$(git log --pretty=format:"- %s")
          else
            changelog=$(git log --pretty=format:"- %s" "$PREVIOUS_TAG..$CURRENT_TAG")
          fi

          echo "changelog<<EOF" >> "$GITHUB_OUTPUT"
          echo "$changelog" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

  release:
    needs: changelog
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libssl-dev \
            pkg-config

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build server and browser UI
        run: |
          bun run build
          cargo build --locked --release --manifest-path src-tauri/Cargo.toml
          sh packaging/bundle.sh

      - name: Publish Linux package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_TITLE: ${{ env.APP_NAME }} ${{ github.ref_name }}
          RELEASE_NOTES: ${{ needs.changelog.outputs.changelog }}
        run: |
          printf '%s\n' "$RELEASE_NOTES" > release-notes.md
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TITLE" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" dist/diskless-manager-linux-x86_64.tar.gz --clobber

      - name: Upload Linux package artifact
        uses: actions/upload-artifact@v4
        with:
          name: diskless-manager-release-linux-x86_64
          path: dist/diskless-manager-linux-x86_64.tar.gz
          if-no-files-found: error

  windows-servicer:
    name: Build Windows servicing helper
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./tools/windows-servicer -> target"

      - name: Build Windows servicing helper
        run: cargo build --release --manifest-path tools/windows-servicer/Cargo.toml

      - name: Upload Windows servicing helper artifact
        uses: actions/upload-artifact@v4
        with:
          name: diskless-windows-servicer
          path: |
            tools/windows-servicer/target/release/diskless-windows-servicer.exe
            tools/windows-servicer/install.ps1
          if-no-files-found: error

  publish-windows-servicer:
    name: Publish Windows servicing helper
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - release
      - windows-servicer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows servicing helper
        uses: actions/download-artifact@v4
        with:
          name: diskless-windows-servicer
          path: windows-servicer

      - name: Attach helper to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" windows-servicer/diskless-windows-servicer.exe --clobber
          gh release upload "${{ github.ref_name }}" windows-servicer/install.ps1 --clobber
