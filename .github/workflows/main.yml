name: "Publish Release"

on:
  push:
    tags:
      - "release-v*.*.*"
  workflow_dispatch:

jobs:
  changelog:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/release-v')
    outputs:
      changelog: ${{ steps.build_changelog.outputs.changelog }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build changelog
        id: build_changelog
        run: |
          CURRENT_TAG=${GITHUB_REF#refs/tags/}
          PREVIOUS_TAG=$(git tag --sort=-v:refname | grep -vxF "$CURRENT_TAG" | head -n1 || true)
          if [ -n "$PREVIOUS_TAG" ]; then
            COMMITS=$(git log --no-merges --pretty=format:'%s' "$PREVIOUS_TAG..$CURRENT_TAG")
          else
            # The first tagged release would otherwise list the entire
            # repository history. Summarize the final development stretch.
            COMMITS=$(git log --no-merges --pretty=format:'%s' -n 40 "$CURRENT_TAG")
          fi

          notes=$(mktemp)
          if [ -n "$PREVIOUS_TAG" ]; then
            printf 'Changes since %s.\n\n' "$PREVIOUS_TAG" > "$notes"
          else
            printf 'First tagged release. The entries below cover the final development stretch; earlier history remains in the commit log.\n\n' > "$notes"
          fi

          # Group conventional commits and drop routine maintenance noise so
          # the release body stays readable.
          add_section() {
            title=$1
            pattern=$2
            lines=$(printf '%s\n' "$COMMITS" \
              | grep -E "$pattern" \
              | sed -E 's/^(feat|fix|perf|refactor|docs)(\([^)]*\))?!?:[[:space:]]*/- /' \
              | awk '!seen[$0]++' || true)
            if [ -n "$lines" ]; then
              printf '## %s\n%s\n\n' "$title" "$lines" >> "$notes"
            fi
          }

          add_section 'Features' '^feat(\([^)]*\))?!?:'
          add_section 'Fixes' '^fix(\([^)]*\))?!?:'
          add_section 'Improvements' '^(perf|refactor)(\([^)]*\))?!?:'
          add_section 'Documentation' '^docs(\([^)]*\))?!?:'
          other=$(printf '%s\n' "$COMMITS" \
            | grep -Ev '^(feat|fix|perf|refactor|docs|ci|build|test|chore)(\([^)]*\))?!?:' \
            | sed '/^$/d' \
            | awk '!seen[$0]++' || true)
          if [ -n "$other" ]; then
            printf '## Other Changes\n' >> "$notes"
            printf '%s\n' "$other" | sed 's/^/- /' >> "$notes"
            printf '\n' >> "$notes"
          fi

          if [ -n "$PREVIOUS_TAG" ]; then
            printf '**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
              "$GITHUB_REPOSITORY" "$PREVIOUS_TAG" "$CURRENT_TAG" >> "$notes"
          fi

          {
            echo "changelog<<EOF"
            cat "$notes"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          cat "$notes"

  release:
    needs: changelog
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/release-v')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libssl-dev pkg-config

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build server archive
        run: |
          bun run build
          cargo build --release --locked --manifest-path src-tauri/Cargo.toml
          mkdir -p release/diskless-manager
          install -m 755 src-tauri/target/release/diskless-manager packaging/install.sh release/diskless-manager/
          install -m 644 systemd/diskless-manager.service release/diskless-manager/
          cp -r dist release/diskless-manager/
          tar -C release -czf diskless-manager-linux-x86_64.tar.gz diskless-manager
          tar -tzf diskless-manager-linux-x86_64.tar.gz > release/contents.txt
          grep -qx diskless-manager/dist/index.html release/contents.txt
          grep -qx diskless-manager/install.sh release/contents.txt
          grep -qx diskless-manager/diskless-manager.service release/contents.txt
          grep -qx diskless-manager/diskless-manager release/contents.txt

      - name: Upload server archive
        uses: actions/upload-artifact@v4
        with:
          name: diskless-manager-linux-x86_64
          path: diskless-manager-linux-x86_64.tar.gz
          if-no-files-found: error

      - name: Publish server release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: ${{ needs.changelog.outputs.changelog }}
        run: |
          printf '%s\n' "$RELEASE_NOTES" > release-notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" diskless-manager-linux-x86_64.tar.gz --clobber
          else
            gh release create "$GITHUB_REF_NAME" diskless-manager-linux-x86_64.tar.gz --title "$GITHUB_REF_NAME" --notes-file release-notes.md
          fi


  windows-servicer:
    name: Build Windows servicing helper
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/release-v'))
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./tools/windows-servicer -> target"

      - name: Build Windows servicing helper
        run: cargo build --release --manifest-path tools/windows-servicer/Cargo.toml

      - name: Package Windows client
        shell: pwsh
        run: |
          $bundle = 'tools/windows-servicer/target/client-bundle'
          New-Item -ItemType Directory -Force -Path $bundle | Out-Null
          Copy-Item tools/windows-servicer/target/release/diskless-windows-servicer.exe $bundle
          Copy-Item tools/windows-servicer/install-client.ps1, tools/windows-servicer/uninstall-client.ps1, tools/windows-servicer/README.md, tools/windows-servicer/REA-NOTES.md $bundle
          New-Item -ItemType Directory -Force -Path "$bundle/client-report" | Out-Null
          Copy-Item tools/windows-servicer/client-report/TESTING.md "$bundle/client-report"
          Compress-Archive -Path "$bundle/*" -DestinationPath tools/windows-servicer/target/diskless-windows-client.zip -Force

      - name: Upload Windows client bundle
        uses: actions/upload-artifact@v4
        with:
          name: diskless-windows-client
          path: tools/windows-servicer/target/diskless-windows-client.zip
          if-no-files-found: error

      - name: Stage servicing helper artifact
        shell: pwsh
        run: |
          $staging = 'tools/windows-servicer/target/servicer-artifact'
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item tools/windows-servicer/target/release/diskless-windows-servicer.exe $staging
          Copy-Item tools/windows-servicer/install.ps1 $staging

      - name: Upload Windows servicing helper artifact
        uses: actions/upload-artifact@v4
        with:
          name: diskless-windows-servicer
          # A wildcard flattens the staging directory, so the downloaded
          # artifact has both files at its root for hashing and publishing.
          path: tools/windows-servicer/target/servicer-artifact/*
          if-no-files-found: error

  publish-windows-servicer:
    name: Publish Windows servicing helper
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/release-v')
    needs:
      - release
      - windows-servicer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # This job does not check out the repository, so gh needs an explicit
    # repository to attach assets to the release.
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download Windows servicing helper
        uses: actions/download-artifact@v4
        with:
          name: diskless-windows-servicer
          path: windows-servicer

      - name: Download Windows client bundle
        uses: actions/download-artifact@v4
        with:
          name: diskless-windows-client
          path: windows-client

      - name: Download server archive
        uses: actions/download-artifact@v4
        with:
          name: diskless-manager-linux-x86_64
          path: server-archive

      - name: Hash release artifacts
        run: |
          # Plain basenames so `sha256sum -c SHA256SUMS.txt` verifies every
          # downloaded release asset from a single directory.
          {
            (cd server-archive && sha256sum diskless-manager-linux-x86_64.tar.gz)
            (cd windows-servicer && sha256sum diskless-windows-servicer.exe install.ps1)
            (cd windows-client && sha256sum diskless-windows-client.zip)
          } > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attach helper to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" windows-servicer/diskless-windows-servicer.exe --clobber
          gh release upload "${{ github.ref_name }}" windows-servicer/install.ps1 --clobber
          gh release upload "${{ github.ref_name }}" SHA256SUMS.txt --clobber

      - name: Attach client to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" windows-client/diskless-windows-client.zip --clobber
