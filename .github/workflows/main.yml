name: "Publish Release"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  changelog:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    outputs:
      changelog: ${{ steps.build_changelog.outputs.changelog }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build changelog
        id: build_changelog
        run: |
          ALL_TAGS=$(git tag --sort=-v:refname)
          CURRENT_TAG=${GITHUB_REF#refs/tags/}

          PREVIOUS_TAG=""
          FOUND_CURRENT=false
          for tag in $ALL_TAGS; do
            if [ "$tag" = "$CURRENT_TAG" ]; then
              FOUND_CURRENT=true
              continue
            fi
            if [ "$FOUND_CURRENT" = true ]; then
              PREVIOUS_TAG=$tag
              break
            fi
          done

          if [ -z "$PREVIOUS_TAG" ]; then
            changelog=$(git log --pretty=format:"- %s")
          else
            changelog=$(git log --pretty=format:"- %s" "$PREVIOUS_TAG..$CURRENT_TAG")
          fi

          echo "changelog<<EOF" >> "$GITHUB_OUTPUT"
          echo "$changelog" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

  release:
    needs: changelog
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libssl-dev pkg-config

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build server archive
        run: |
          bun run build
          cargo build --release --locked --manifest-path src-tauri/Cargo.toml
          mkdir -p release/diskless-manager
          install -m 755 src-tauri/target/release/diskless-manager packaging/install.sh release/diskless-manager/
          install -m 644 systemd/diskless-manager.service release/diskless-manager/
          cp -r dist release/diskless-manager/
          tar -C release -czf diskless-manager-linux-x86_64.tar.gz diskless-manager
          tar -tzf diskless-manager-linux-x86_64.tar.gz > release/contents.txt
          grep -qx diskless-manager/dist/index.html release/contents.txt
          grep -qx diskless-manager/install.sh release/contents.txt
          grep -qx diskless-manager/diskless-manager.service release/contents.txt
          grep -qx diskless-manager/diskless-manager release/contents.txt

      - name: Upload server archive
        uses: actions/upload-artifact@v4
        with:
          name: diskless-manager-linux-x86_64
          path: diskless-manager-linux-x86_64.tar.gz
          if-no-files-found: error

      - name: Publish server release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: ${{ needs.changelog.outputs.changelog }}
        run: |
          printf '%s\n' "$RELEASE_NOTES" > release-notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" diskless-manager-linux-x86_64.tar.gz --clobber
          else
            gh release create "$GITHUB_REF_NAME" diskless-manager-linux-x86_64.tar.gz --title "$GITHUB_REF_NAME" --notes-file release-notes.md
          fi


  windows-servicer:
    name: Build Windows servicing helper
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./tools/windows-servicer -> target"

      - name: Build Windows servicing helper
        run: cargo build --release --manifest-path tools/windows-servicer/Cargo.toml

      - name: Upload Windows servicing helper artifact
        uses: actions/upload-artifact@v4
        with:
          name: diskless-windows-servicer
          path: |
            tools/windows-servicer/target/release/diskless-windows-servicer.exe
            tools/windows-servicer/install.ps1
          if-no-files-found: error

  publish-windows-servicer:
    name: Publish Windows servicing helper
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - release
      - windows-servicer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows servicing helper
        uses: actions/download-artifact@v4
        with:
          name: diskless-windows-servicer
          path: windows-servicer

      - name: Attach helper to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" windows-servicer/diskless-windows-servicer.exe --clobber
          gh release upload "${{ github.ref_name }}" windows-servicer/install.ps1 --clobber
