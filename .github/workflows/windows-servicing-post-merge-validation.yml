name: "Windows Servicing Post-Merge Validation"

on:
  push:
    branches:
      - "feature/windows-driver-harvest-boot-arm"

permissions:
  contents: read

concurrency:
  group: windows-servicing-post-merge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend compile, tests, clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
