name: "CI"

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "v*"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install server build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libssl-dev \
            pkg-config

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Windows helper format and tests
        run: |
          cargo fmt --manifest-path tools/windows-servicer/Cargo.toml -- --check
          cargo test --locked --manifest-path tools/windows-servicer/Cargo.toml
          cargo clippy --locked --manifest-path tools/windows-servicer/Cargo.toml --all-targets -- -D warnings

      - name: Cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

  frontend:
    name: Frontend validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Tests
        run: bun run test --run

      - name: Production build
        run: bun run build

  server-build:
    name: Server package build
    needs:
      - rust
      - frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install server build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libssl-dev pkg-config

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build server archive
        run: |
          bun run build
          cargo build --release --locked --manifest-path src-tauri/Cargo.toml
          mkdir -p release/diskless-manager
          install -m 755 src-tauri/target/release/diskless-manager packaging/install.sh release/diskless-manager/
          install -m 644 systemd/diskless-manager.service release/diskless-manager/
          cp -r dist release/diskless-manager/
          tar -C release -czf diskless-manager-linux-x86_64.tar.gz diskless-manager
          tar -tzf diskless-manager-linux-x86_64.tar.gz > release/contents.txt
          grep -qx diskless-manager/dist/index.html release/contents.txt
          grep -qx diskless-manager/install.sh release/contents.txt
          grep -qx diskless-manager/diskless-manager.service release/contents.txt
          grep -qx diskless-manager/diskless-manager release/contents.txt

      - name: Upload server archive
        uses: actions/upload-artifact@v4
        with:
          name: diskless-manager-linux-x86_64
          path: diskless-manager-linux-x86_64.tar.gz
          if-no-files-found: error
