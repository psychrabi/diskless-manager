name: "Feature Frontend Validation"

on:
  push:
    branches:
      - "feature/windows-driver-harvest-boot-arm"

permissions:
  contents: read

concurrency:
  group: feature-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Feature frontend check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Tests
        run: bun run test --run

      - name: Production build
        run: bun run build
