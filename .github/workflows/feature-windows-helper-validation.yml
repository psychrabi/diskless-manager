name: "Feature Windows Helper Validation"

on:
  push:
    branches:
      - "feature/windows-driver-harvest-boot-arm"

permissions:
  contents: read

concurrency:
  group: feature-windows-helper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  helper:
    name: Windows helper build
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Build helper
        run: cargo build --release --manifest-path src-tauri/Cargo.toml --bin diskless-windows-servicer
