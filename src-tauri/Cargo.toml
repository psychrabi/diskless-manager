[package]
name = "diskless-manager"
version = "1.0.0"
description = "Diskless Boot Server for booting diskless clients"
authors = ["Rabi Shrestha"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.5.0", features = ["tray-icon"] }
tauri-plugin-log = "2.0.0-rc"
chrono = { version = "0.4.42", features = ["serde"] }
regex = "1.11.1"
once_cell = "1.21.3"
tauri-plugin-process = "2"
dirs = "6.0.0"
async-process = "2.4.0"
futures = "0.3.31"
tokio = { version = "1.47.1", features = ["full"] }
sysinfo = { version = "0.36.1", default-features = false, features = [
    "serde",
    "system",
] }
jsonwebtoken = "9.3.0"
bcrypt = "0.15.0"
lazy_static = "1.4.0"
reqwest = { version = "0.11", features = ["blocking", "json", "rustls-tls"] }
thiserror = "2.0.17"
toml = "0.8"
fs2 = "0.4"
tracing = { version = "0.1", features = ["log"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1.0.100"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "sqlite"] }
hostname = "0.4.2"
num_cpus = "1.17.0"
uuid = { version = "1.19.0", features = ["v4", "serde"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-os = "2"
tauri-plugin-shell = "2"
axum = "0.8.4"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tower = { version = "0.5.2", features = ["limit"] }


[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"


[profile.dev]
incremental = true # Compile your binary in smaller steps.

[profile.release]
codegen-units = 1 # Allows LLVM to perform better optimization.
lto = true        # Enables link-time-optimizations.
opt-level = "s"   # Prioritizes small binary size. Use `3` if you prefer speed.
panic = "abort"   # Higher performance by disabling panic handlers.
strip = true      # Ensures debug symbols are removed.
