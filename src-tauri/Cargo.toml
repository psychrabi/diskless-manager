[package]
name = "diskless-server"
version = "0.1.0"
description = "Diskless Boot Server for booting diskless clients"
authors = ["Rabi Shrestha"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.5.0", features = [] }
tauri-plugin-log = "2.0.0-rc"
chrono = "0.4.41"
regex = "1.11.1"
once_cell = "1.21.3"
directories = "6.0.0"
tauri-plugin-process = "2"
dirs = "6.0.0"
async-process = "2.4.0"
futures = "0.3.31"
tokio = { version = "1.47.1", features = ["rt-multi-thread", "sync"] }
sysinfo = { version = "0.36.1", default-features = false, features = ["serde", "system"] }
which = "8.0.0"
jsonwebtoken = "9.3.0"
bcrypt = "0.15.0"
rand = "0.8.5"
lazy_static = "1.4.0"
reqwest = { version = "0.11", features = ["blocking", "json", "rustls-tls"] }
thiserror = "2.0.17"
toml = "0.8"
fs2 = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"


[profile.dev]
incremental = true # Compile your binary in smaller steps.

[profile.release]
codegen-units = 1 # Allows LLVM to perform better optimization.
lto = true # Enables link-time-optimizations.
opt-level = "s" # Prioritizes small binary size. Use `3` if you prefer speed.
panic = "abort" # Higher performance by disabling panic handlers.
strip = true # Ensures debug symbols are removed.
