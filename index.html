<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e293b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <title>Diskless Manager</title>
    <script>
      // Set theme early to avoid flash of wrong theme
      (function () {
        try {
          const stored = localStorage.getItem("theme");
          const prefersDark =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          const theme = stored || (prefersDark ? "dark" : "light");
          const root = document.documentElement;
          if (theme === "dark") {
            root.classList.add("dark");
            root.setAttribute("data-theme", "dark");
          } else {
            root.classList.remove("dark");
            root.setAttribute("data-theme", "light");
          }
        } catch (_) {}
      })();
    </script>
    <style>
      .boot-shell {
        min-height: 100svh;
        display: grid;
        place-content: center;
        gap: 14px;
        padding: 24px;
        background: #f3f6f8;
        color: #1c2530;
        font-family: "Geist Variable", ui-sans-serif, system-ui, sans-serif;
      }
      .boot-shell__mark {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: -0.015em;
      }
      .boot-shell__dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: oklch(0.47 0.092 190);
        box-shadow: 0 0 0 6px color-mix(in oklch, oklch(0.47 0.092 190) 14%, transparent);
      }
      .boot-shell__bar {
        width: 180px;
        height: 3px;
        border-radius: 999px;
        overflow: hidden;
        background: color-mix(in oklch, #1c2530 10%, transparent);
      }
      .boot-shell__bar::after {
        content: "";
        display: block;
        width: 45%;
        height: 100%;
        border-radius: inherit;
        background: oklch(0.47 0.092 190);
        animation: boot-shell-progress 1.1s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }
      .boot-shell__hint {
        margin: 0;
        font-size: 12px;
        color: #5f6d7a;
      }
      @keyframes boot-shell-progress {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(320%); }
      }
      html.dark .boot-shell { background: #0f141a; color: #eef3f6; }
      html.dark .boot-shell__bar { background: color-mix(in oklch, #eef3f6 12%, transparent); }
      html.dark .boot-shell__hint { color: #96a3af; }
      @media (prefers-reduced-motion: reduce) {
        .boot-shell__bar::after { animation: none; width: 45%; transform: translateX(60%); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-shell" role="status" aria-live="polite" aria-label="Loading Diskless Manager">
        <div class="boot-shell__mark"><span class="boot-shell__dot" aria-hidden="true"></span>Diskless Manager</div>
        <div class="boot-shell__bar" aria-hidden="true"></div>
        <p class="boot-shell__hint">Starting workspace…</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
