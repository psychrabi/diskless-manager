[package]
name = "diskless-windows-servicer"
version = "1.0.0"
edition = "2021"
rust-version = "1.77.2"
publish = false

[dependencies]
anyhow = "1.0.100"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
