[package]
name = "diskless-windows-servicer"
version = "1.0.0"
edition = "2021"
rust-version = "1.77.2"
publish = false

[features]
default = ["gui"]
gui = ["dep:eframe"]
winpe = []

[dependencies]
anyhow = "1.0.100"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
zip = "2.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Services"] }
eframe = { version = "0.29", optional = true }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
